<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Oficial SEPE - 2n Gestió Administrativa</title>
    <style>
        :root {
            --sepe-blue: #004494;
            --sepe-yellow: #ffcc00;
            --bg-gray: #f2f4f8;
            --border-doc: #333333;
            --correct: #2e7d32;
            --correct-bg: #e8f5e9;
            --wrong: #c62828;
            --wrong-bg: #ffebee;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: #111;
        }
        /* Capçalera superior d'aplicació */
        .app-header {
            background-color: var(--sepe-blue);
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header h1 {
            font-size: 1.1rem;
            margin: 0;
        }
        .score-badge {
            background: white;
            color: var(--sepe-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Pantalla Login */
        #login-screen {
            max-width: 500px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            border-top: 6px solid var(--sepe-blue);
        }
        #login-screen h2 {
            margin-top: 0;
            color: var(--sepe-blue);
        }
        .input-group {
            margin: 20px 0;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .mail-info {
            background: #e3f2fd;
            border-left: 4px solid var(--sepe-blue);
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: var(--sepe-blue);
            color: white;
            border: none;
            padding: 13px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover { background-color: #00306b; }

        /* Contenidor Principal */
        #main-app {
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .hidden { display: none !important; }

        /* Navegació Pestanyes */
        .tabs-bar {
            display: flex;
            gap: 6px;
            border-bottom: 3px solid var(--sepe-blue);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #dce3ec;
            border: none;
            padding: 12px 18px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--sepe-blue);
            color: white;
        }

        /* Estructura a 2 columnes: Cas Pràctic (Esquerra) + Model PDF SEPE (Dreta) */
        .workspace {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start;
        }
        .case-panel {
            background: white;
            padding: 18px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            position: sticky;
            top: 70px;
            max-height: calc(100vh - 90px);
            overflow-y: auto;
            border: 1px solid #d0d7de;
        }
        .case-panel h3 {
            margin-top: 0;
            color: var(--sepe-blue);
            font-size: 1rem;
            border-bottom: 2px solid var(--sepe-yellow);
            padding-bottom: 6px;
        }
        .case-story {
            font-size: 0.85rem;
            line-height: 1.45;
            background: #f9fbfd;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #e1e8f0;
            margin-bottom: 15px;
        }
        .tags-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .drag-tag {
            background: #fff;
            border: 1.5px solid var(--sepe-blue);
            color: var(--sepe-blue);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .drag-tag:active { cursor: grabbing; }

        /* Estil Maquetació Oficial Document SEPE */
        .sepe-document {
            background: white;
            padding: 30px;
            border: 1px solid #bbb;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            font-size: 0.84rem;
        }
        .sepe-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-doc);
            padding: 8px 15px;
            margin-bottom: 12px;
            background: #fafafa;
            font-weight: bold;
            font-size: 0.78rem;
        }
        .sepe-doc-title {
            background: #d9d9d9;
            border: 1px solid var(--border-doc);
            text-align: center;
            font-weight: bold;
            padding: 7px;
            font-size: 0.95rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .sepe-section-header {
            background: #eaeaea;
            border: 1px solid var(--border-doc);
            border-bottom: none;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-top: 12px;
        }
        .sepe-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            border-top: 1px solid var(--border-doc);
            border-left: 1px solid var(--border-doc);
        }
        .sepe-cell {
            border-right: 1px solid var(--border-doc);
            border-bottom: 1px solid var(--border-doc);
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .col-3 { grid-column: span 3; }
        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }
        .col-8 { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        .field-label {
            font-size: 0.68rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .clauses-box {
            border: 1px solid var(--border-doc);
            padding: 15px;
            margin-top: 12px;
            line-height: 1.85;
        }
        .clauses-box p { margin: 8px 0; }

        /* Caselles per deixar anar (Dropzones) */
        .dropzone {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 145px;
            min-height: 26px;
            border: 1.5px dashed var(--sepe-blue);
            background-color: #f0f6ff;
            border-radius: 3px;
            padding: 2px 8px;
            margin: 2px 4px;
            font-weight: bold;
            font-size: 0.82rem;
            vertical-align: middle;
            transition: all 0.2s;
        }
        .sepe-cell .dropzone {
            width: 100%;
            margin: 0;
        }
        .dropzone.dragover {
            background-color: #cfe2ff;
            border-color: #002752;
            transform: scale(1.02);
        }
        .dropzone.correct {
            background-color: var(--correct-bg);
            border: 1.5px solid var(--correct);
            color: var(--correct);
        }
        .dropzone.auto-corrected {
            background-color: var(--wrong-bg);
            border: 1.5px solid var(--wrong);
            color: var(--wrong);
        }

        /* Taula per a Crida Fixos Discontinus */
        .sepe-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .sepe-table th, .sepe-table td {
            border: 1px solid var(--border-doc);
            padding: 6px;
            text-align: center;
            font-size: 0.78rem;
        }
        .sepe-table th { background: #eaeaea; }

        .submit-bar {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
