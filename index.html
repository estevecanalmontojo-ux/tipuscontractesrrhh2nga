<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Oficial SEPE - 2n Gestió Administrativa</title>
    <style>
        :root {
            --sepe-blue: #004494;
            --sepe-yellow: #ffcc00;
            --bg-gray: #f2f4f8;
            --border-doc: #333333;
            --correct: #2e7d32;
            --correct-bg: #e8f5e9;
            --wrong: #c62828;
            --wrong-bg: #ffebee;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: #111;
        }
        .app-header {
            background-color: var(--sepe-blue);
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header h1 {
            font-size: 1.1rem;
            margin: 0;
        }
        .score-badge {
            background: white;
            color: var(--sepe-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        #login-screen {
            max-width: 500px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            border-top: 6px solid var(--sepe-blue);
        }
        #login-screen h2 {
            margin-top: 0;
            color: var(--sepe-blue);
        }
        .input-group {
            margin: 20px 0;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .mail-info {
            background: #e3f2fd;
            border-left: 4px solid var(--sepe-blue);
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: var(--sepe-blue);
            color: white;
            border: none;
            padding: 13px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-primary:hover { background-color: #00306b; }
        .btn-primary:disabled { background-color: #888; cursor: not-allowed; }
        #main-app {
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .hidden { display: none !important; }
        .tabs-bar {
            display: flex;
            gap: 6px;
            border-bottom: 3px solid var(--sepe-blue);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
